worker_processes  1;

error_log  logs/error.log info;

events {
    worker_connections  1024;
}

# RTMP 服务器
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            meta copy;
        }

        application hls {
            live on;
            hls on;
            hls_path temp/hls;
            hls_fragment 8s;
        }
    }
}

# HTTP 服务器
http {
    server {
        listen      8080;

        location / {
            root html;
            index index.html;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root html;
        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias temp/hls;
            expires -1;
        }
    }

    # HTTPS 服务器（用于 RTMPS 测试）
    server {
        listen      8443 ssl;
        server_name  localhost;

        ssl_certificate      D:/nginx-rtmp-win32/ssl/cert.crt;
        ssl_certificate_key  D:/nginx-rtmp-win32/ssl/cert.key;

        location / {
            root html;
            index index.html;
        }
    }
}

# Stream 模块（用于 RTMPS 转发）
# 需要 nginx 编译时开启 --with-stream --with-stream_ssl_module
stream {
    server {
        listen 1936 ssl;
        ssl_certificate      D:/nginx-rtmp-win32/ssl/cert.crt;
        ssl_certificate_key  D:/nginx-rtmp-win32/ssl/cert.key;

        # 减少缓冲延迟
        proxy_buffer_size 4k;
        proxy_connect_timeout 1s;
        proxy_timeout 10m;

        proxy_pass 127.0.0.1:1935;
    }
}
